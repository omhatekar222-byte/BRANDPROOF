services:
  backend:
    build: ./backend
    environment:
      ENV: production
      DATABASE_URL: sqlite:///./brandproof.db
      JWT_SECRET: change-me-in-production-brandproof-dev-secret
      CORS_ORIGINS: http://localhost:4173,http://localhost:5173
    volumes:
      - brandproof_data:/app/uploads
      - brandproof_db:/app
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    ports:
      - "4173:80"
    depends_on:
      - backend

volumes:
  brandproof_data:
  brandproof_db:
